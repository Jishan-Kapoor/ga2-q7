name: Cache Example

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: prime-cache-a7274ae
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-a7274ae

      - name: Report cache status
        run: echo "Cache result: ${{ steps.cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
